name: Terraform CI/CD

on:
  pull_request:
    paths: ["**.tf", "**.tfvars"]
  push:
    branches: [main]

permissions:
  id-token: write   # OIDC — no long-lived AWS keys
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.x }
      - name: fmt check
        run: terraform fmt -check -recursive
      - name: init & validate (dev)
        working-directory: environments/dev
        run: |
          terraform init -backend=false
          terraform validate

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: policies/checkov.yaml
      - uses: aquasecurity/tfsec-action@v1.0.3
        with: { working_directory: . }

  plan:
    needs: [validate, security-scan]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-oidc-terraform
          aws-region: us-east-1
      - name: plan
        working-directory: environments/dev
        run: |
          terraform init -backend-config=backend.tfvars
          terraform plan -var-file=dev.tfvars -no-color

  apply:
    needs: [validate, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-oidc-terraform
          aws-region: us-east-1
      - name: apply prod
        working-directory: environments/prod
        run: |
          terraform init -backend-config=backend.tfvars
          terraform apply -var-file=prod.tfvars -auto-approve
